<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | AI Study Assistant</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="auth-page"><div class="auth-card"><a class="brand" href="/">AI<span>Study</span></a><h1>Create account</h1><p>Start learning with your personal study assistant.</p><form id="registerForm"><label>Name<input id="name" type="text" required maxlength="100" autocomplete="name"></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn" type="submit">Create Account</button><p id="message" class="message"></p></form><p class="switch">Already registered? <a href="/login.html">Login</a></p></div></main><script src="/app.js"></script></body></html>
