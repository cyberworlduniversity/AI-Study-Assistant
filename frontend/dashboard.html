<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | AI Study Assistant</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="dashboard"><header class="dash-header"><a class="brand" href="/">AI<span>Study</span></a><div><span id="userName"></span><button id="logoutBtn" class="btn ghost small">Logout</button></div></header><section class="dash-grid"><aside class="side"><h2>Study Assistant</h2><p>Ask a question and receive a simple explanation.</p><div class="chips"><button data-question="Explain Python">Python</button><button data-question="What is HTML?">HTML</button><button data-question="Explain CSS">CSS</button><button data-question="What is JavaScript?">JavaScript</button><button data-question="Explain SQL">SQL</button><button data-question="What is cybersecurity?">Cybersecurity</button></div></aside><section class="chat"><div id="chatBox" class="chat-box"><div class="bubble bot">Hello! What would you like to study today?</div></div><form id="chatForm" class="chat-form"><input id="chatInput" maxlength="2000" placeholder="Ask a study question..." autocomplete="off" required><button class="btn" type="submit">Send</button></form></section></section></main><script src="/app.js"></script></body></html>
